frr version 10.7.1
frr defaults traditional
hostname wan-p1
no ipv6 forwarding
!
interface eth1
 description L1 to wan-p2
 ip address 10.0.1.1/30
!
interface eth2
 description L2 to a-edge
 ip address 10.0.2.1/30
!
interface eth3
 description L4 to b-edge
 ip address 10.0.4.1/30
!
interface lo
 ip address 10.0.0.1/32
!
line vty
!