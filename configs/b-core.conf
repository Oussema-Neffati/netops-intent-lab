frr version 10.7.1
frr defaults traditional
hostname b-core
no ipv6 forwarding
!
interface eth1
 description L7 to b-edge
 ip address 10.2.1.2/30
!
interface eth2
 description LAN1 to h-b1
 ip address 10.2.10.1/24
!
interface eth3
 description LAN2 to h-b2
 ip address 10.2.20.1/24
!
interface lo
 ip address 10.2.0.2/32
!
line vty
!