frr version 10.7.1
frr defaults traditional
hostname b-core
no ipv6 forwarding
!
interface eth1
 description L7 to b-edge
 ip address 10.2.1.2/30
 ip ospf network point-to-point
!
interface eth2
 description LAN1 to h-b1
 ip address 10.2.10.1/24
!
interface eth3
 description LAN2 to h-b2
 ip address 10.2.20.1/24
!
interface lo
 ip address 10.2.0.2/32
!
router ospf
 ospf router-id 10.2.0.2
 passive-interface lo
 passive-interface eth2
 passive-interface eth3
 network 10.2.0.2/32 area 0
 network 10.2.1.0/30 area 0
 network 10.2.10.0/24 area 0
 network 10.2.20.0/24 area 0
!
line vty
!