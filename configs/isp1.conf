frr version 10.7.1
frr defaults traditional
hostname isp1
no ipv6 forwarding
!
interface eth1
 description W1 to a-edge1
 ip address 10.0.1.1/30
!
interface eth2
 description W3 to b-edge1
 ip address 10.0.3.1/30
!
interface lo
 ip address 10.0.0.1/32
!
ip prefix-list CUST-A-IN seq 10 permit 10.1.0.0/16
ip prefix-list CUST-B-IN seq 10 permit 10.2.0.0/16
ip prefix-list TO-CUST seq 10 permit 10.1.0.0/16
ip prefix-list TO-CUST seq 20 permit 10.2.0.0/16
!
route-map FROM-SITE-A permit 10
 match ip address prefix-list CUST-A-IN
!
route-map FROM-SITE-B permit 10
 match ip address prefix-list CUST-B-IN
!
route-map TO-CUSTOMER permit 10
 match ip address prefix-list TO-CUST
!
router bgp 65010
 bgp router-id 10.0.0.1
 neighbor 10.0.1.2 remote-as 65001
 neighbor 10.0.1.2 description a-edge1
 neighbor 10.0.1.2 password lab-bgp-key
 neighbor 10.0.1.2 bfd
 neighbor 10.0.3.2 remote-as 65002
 neighbor 10.0.3.2 description b-edge1
 neighbor 10.0.3.2 password lab-bgp-key
 neighbor 10.0.3.2 bfd
 !
 address-family ipv4 unicast
  neighbor 10.0.1.2 activate
  neighbor 10.0.1.2 default-originate
  neighbor 10.0.1.2 route-map FROM-SITE-A in
  neighbor 10.0.1.2 route-map TO-CUSTOMER out
  neighbor 10.0.1.2 maximum-prefix 10
  neighbor 10.0.3.2 activate
  neighbor 10.0.3.2 default-originate
  neighbor 10.0.3.2 route-map FROM-SITE-B in
  neighbor 10.0.3.2 route-map TO-CUSTOMER out
  neighbor 10.0.3.2 maximum-prefix 10
 exit-address-family
!
line vty
!
