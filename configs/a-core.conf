frr version 10.7.1
frr defaults traditional
hostname a-core
no ipv6 forwarding
!
interface eth1
 description L6 to a-edge
 ip address 10.1.1.2/30
!
interface eth2
 description LAN1 to h-a1
 ip address 10.1.10.1/24
!
interface eth3
 description LAN2 to h-a2
 ip address 10.1.20.1/24
!
interface lo
 ip address 10.1.0.2/32
!
line vty
!