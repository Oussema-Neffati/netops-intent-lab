frr version 10.7.1
frr defaults traditional
hostname wan-p2
no ipv6 forwarding
!
interface eth1
 description L1 to wan-p1
 ip address 10.0.1.2/30
 ip ospf network point-to-point
!
interface eth2
 description L3 to a-edge
 ip address 10.0.3.1/30
!
interface eth3
 description L5 to b-edge
 ip address 10.0.5.1/30
!
interface lo
 ip address 10.0.0.2/32
!
ip prefix-list CUST-A-IN seq 10 permit 10.1.0.0/16
ip prefix-list CUST-B-IN seq 10 permit 10.2.0.0/16
ip prefix-list TO-CUST seq 10 permit 10.1.0.0/16
ip prefix-list TO-CUST seq 20 permit 10.2.0.0/16
!
route-map FROM-SITE-A permit 10
 match ip address prefix-list CUST-A-IN
!
route-map FROM-SITE-B permit 10
 match ip address prefix-list CUST-B-IN
!
route-map TO-CUSTOMER permit 10
 match ip address prefix-list TO-CUST
!
router ospf
 ospf router-id 10.0.0.2
 passive-interface lo
 network 10.0.0.2/32 area 0
 network 10.0.1.0/30 area 0
!
router bgp 65000
 bgp router-id 10.0.0.2
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 description wan-p1
 neighbor 10.0.0.1 update-source lo
 neighbor 10.0.3.2 remote-as 65001
 neighbor 10.0.3.2 description a-edge
 neighbor 10.0.5.2 remote-as 65002
 neighbor 10.0.5.2 description b-edge
 !
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 next-hop-self
  neighbor 10.0.3.2 activate
  neighbor 10.0.3.2 default-originate
  neighbor 10.0.3.2 route-map FROM-SITE-A in
  neighbor 10.0.3.2 route-map TO-CUSTOMER out
  neighbor 10.0.5.2 activate
  neighbor 10.0.5.2 default-originate
  neighbor 10.0.5.2 route-map FROM-SITE-B in
  neighbor 10.0.5.2 route-map TO-CUSTOMER out
 exit-address-family
!
line vty
!