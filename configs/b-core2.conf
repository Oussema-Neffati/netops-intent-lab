frr version 10.7.1
frr defaults traditional
hostname b-core2
no ipv6 forwarding
!
interface eth1
 description B2 to b-edge1
 ip address 10.2.1.6/30
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 lab-ospf-key
!
interface eth2
 description B4 to b-edge2
 ip address 10.2.1.14/30
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 lab-ospf-key
!
interface eth3
 description trunk to b-sw1
!
interface eth3.10
 description VLAN 10 users
 ip address 10.2.10.3/24
 vrrp 10
 vrrp 10 priority 100
 vrrp 10 ip 10.2.10.1
!
interface eth3.20
 description VLAN 20 users
 ip address 10.2.20.3/24
 vrrp 20
 vrrp 20 priority 100
 vrrp 20 ip 10.2.20.1
!
interface lo
 ip address 10.2.0.4/32
!
router ospf
 ospf router-id 10.2.0.4
 passive-interface lo
 passive-interface eth3
 passive-interface eth3.10
 passive-interface vrrp4-10
 passive-interface eth3.20
 passive-interface vrrp4-20
 network 10.2.0.4/32 area 0
 network 10.2.1.4/30 area 0
 network 10.2.1.12/30 area 0
 network 10.2.10.0/24 area 0
 network 10.2.20.0/24 area 0
!
line vty
!
