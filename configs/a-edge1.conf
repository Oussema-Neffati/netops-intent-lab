frr version 10.7.1
frr defaults traditional
hostname a-edge1
no ipv6 forwarding
!
interface eth1
 description W1 to isp1
 ip address 10.0.1.2/30
!
interface eth2
 description A1 to a-core1
 ip address 10.1.1.1/30
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 lab-ospf-key
!
interface eth3
 description A2 to a-core2
 ip address 10.1.1.5/30
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 lab-ospf-key
!
interface lo
 ip address 10.1.0.1/32
!
ip route 10.1.0.0/16 blackhole
!
ip prefix-list SITE-OUT seq 10 permit 10.1.0.0/16
ip prefix-list FROM-PROVIDER seq 10 permit 0.0.0.0/0
ip prefix-list FROM-PROVIDER seq 20 permit 10.2.0.0/16
!
route-map PROVIDER-IN permit 10
 match ip address prefix-list FROM-PROVIDER
!
route-map PROVIDER-OUT permit 10
 match ip address prefix-list SITE-OUT
!
router ospf
 ospf router-id 10.1.0.1
 passive-interface lo
 passive-interface eth1
 network 10.1.0.1/32 area 0
 network 10.1.1.0/30 area 0
 network 10.1.1.4/30 area 0
 default-information originate
!
router bgp 65001
 bgp router-id 10.1.0.1
 neighbor 10.0.1.1 remote-as 65010
 neighbor 10.0.1.1 description isp1
 neighbor 10.0.1.1 password lab-bgp-key
 neighbor 10.0.1.1 bfd
 neighbor 10.1.0.2 remote-as 65001
 neighbor 10.1.0.2 description a-edge2
 neighbor 10.1.0.2 update-source lo
 neighbor 10.1.0.2 password lab-bgp-key
 !
 address-family ipv4 unicast
  network 10.1.0.0/16
  neighbor 10.0.1.1 activate
  neighbor 10.0.1.1 route-map PROVIDER-IN in
  neighbor 10.0.1.1 route-map PROVIDER-OUT out
  neighbor 10.0.1.1 maximum-prefix 10
  neighbor 10.1.0.2 activate
  neighbor 10.1.0.2 next-hop-self
 exit-address-family
!
line vty
!
