frr version 10.7.1
frr defaults traditional
hostname isp2
no ipv6 forwarding
!
interface eth1
 description W2 to a-edge2
 ip address 10.0.2.1/30
!
interface eth2
 description W4 to b-edge2
 ip address 10.0.4.1/30
!
interface lo
 ip address 10.0.0.2/32
!
ip prefix-list CUST-A-IN seq 10 permit 10.1.0.0/16
ip prefix-list CUST-B-IN seq 10 permit 10.2.0.0/16
ip prefix-list TO-CUST seq 10 permit 10.1.0.0/16
ip prefix-list TO-CUST seq 20 permit 10.2.0.0/16
!
route-map FROM-SITE-A permit 10
 match ip address prefix-list CUST-A-IN
!
route-map FROM-SITE-B permit 10
 match ip address prefix-list CUST-B-IN
!
route-map TO-CUSTOMER permit 10
 match ip address prefix-list TO-CUST
!
router bgp 65020
 bgp router-id 10.0.0.2
 neighbor 10.0.2.2 remote-as 65001
 neighbor 10.0.2.2 description a-edge2
 neighbor 10.0.2.2 password lab-bgp-key
 neighbor 10.0.2.2 bfd
 neighbor 10.0.4.2 remote-as 65002
 neighbor 10.0.4.2 description b-edge2
 neighbor 10.0.4.2 password lab-bgp-key
 neighbor 10.0.4.2 bfd
 !
 address-family ipv4 unicast
  neighbor 10.0.2.2 activate
  neighbor 10.0.2.2 default-originate
  neighbor 10.0.2.2 route-map FROM-SITE-A in
  neighbor 10.0.2.2 route-map TO-CUSTOMER out
  neighbor 10.0.2.2 maximum-prefix 10
  neighbor 10.0.4.2 activate
  neighbor 10.0.4.2 default-originate
  neighbor 10.0.4.2 route-map FROM-SITE-B in
  neighbor 10.0.4.2 route-map TO-CUSTOMER out
  neighbor 10.0.4.2 maximum-prefix 10
 exit-address-family
!
line vty
!
