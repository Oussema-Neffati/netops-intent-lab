frr version 10.7.1
frr defaults traditional
hostname a-edge2
no ipv6 forwarding
!
interface eth1
 description W2 to isp2
 ip address 10.0.2.2/30
!
interface eth2
 description A3 to a-core1
 ip address 10.1.1.9/30
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 lab-ospf-key
!
interface eth3
 description A4 to a-core2
 ip address 10.1.1.13/30
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 lab-ospf-key
!
interface lo
 ip address 10.1.0.2/32
!
ip route 10.1.0.0/16 blackhole
!
ip prefix-list SITE-OUT seq 10 permit 10.1.0.0/16
ip prefix-list FROM-PROVIDER seq 10 permit 0.0.0.0/0
ip prefix-list FROM-PROVIDER seq 20 permit 10.2.0.0/16
!
route-map PROVIDER-IN permit 10
 match ip address prefix-list FROM-PROVIDER
!
route-map PROVIDER-OUT permit 10
 match ip address prefix-list SITE-OUT
!
router ospf
 ospf router-id 10.1.0.2
 passive-interface lo
 passive-interface eth1
 network 10.1.0.2/32 area 0
 network 10.1.1.8/30 area 0
 network 10.1.1.12/30 area 0
 default-information originate
!
router bgp 65001
 bgp router-id 10.1.0.2
 neighbor 10.0.2.1 remote-as 65020
 neighbor 10.0.2.1 description isp2
 neighbor 10.0.2.1 password lab-bgp-key
 neighbor 10.0.2.1 bfd
 neighbor 10.1.0.1 remote-as 65001
 neighbor 10.1.0.1 description a-edge1
 neighbor 10.1.0.1 update-source lo
 neighbor 10.1.0.1 password lab-bgp-key
 !
 address-family ipv4 unicast
  network 10.1.0.0/16
  neighbor 10.0.2.1 activate
  neighbor 10.0.2.1 route-map PROVIDER-IN in
  neighbor 10.0.2.1 route-map PROVIDER-OUT out
  neighbor 10.0.2.1 maximum-prefix 10
  neighbor 10.1.0.1 activate
  neighbor 10.1.0.1 next-hop-self
 exit-address-family
!
line vty
!
