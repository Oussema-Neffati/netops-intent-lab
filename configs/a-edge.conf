frr version 10.7.1
frr defaults traditional
hostname a-edge
no ipv6 forwarding
!
interface eth1
 description L2 to wan-p1
 ip address 10.0.2.2/30
!
interface eth2
 description L3 to wan-p2
 ip address 10.0.3.2/30
!
interface eth3
 description L6 to a-core
 ip address 10.1.1.1/30
 ip ospf network point-to-point
!
interface lo
 ip address 10.1.0.1/32
!
router ospf
 ospf router-id 10.1.0.1
 passive-interface lo
 network 10.1.0.1/32 area 0
 network 10.1.1.0/30 area 0
!
line vty
!