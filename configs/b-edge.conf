frr version 10.7.1
frr defaults traditional
hostname b-edge
no ipv6 forwarding
!
interface eth1
 description L4 to wan-p1
 ip address 10.0.4.2/30
!
interface eth2
 description L5 to wan-p2
 ip address 10.0.5.2/30
!
interface eth3
 description L7 to b-core
 ip address 10.2.1.1/30
 ip ospf network point-to-point
!
interface lo
 ip address 10.2.0.1/32
!
ip route 10.2.0.0/16 blackhole
!
ip prefix-list SITE-B-OUT seq 10 permit 10.2.0.0/16
ip prefix-list FROM-PROVIDER seq 10 permit 0.0.0.0/0
ip prefix-list FROM-PROVIDER seq 20 permit 10.1.0.0/16
!
route-map PROVIDER-IN permit 10
 match ip address prefix-list FROM-PROVIDER
!
route-map PROVIDER-OUT permit 10
 match ip address prefix-list SITE-B-OUT
!
router ospf
 ospf router-id 10.2.0.1
 passive-interface lo
 network 10.2.0.1/32 area 0
 network 10.2.1.0/30 area 0
 default-information originate
!
router bgp 65002
 bgp router-id 10.2.0.1
 neighbor 10.0.4.1 remote-as 65000
 neighbor 10.0.4.1 description wan-p1
 neighbor 10.0.5.1 remote-as 65000
 neighbor 10.0.5.1 description wan-p2
 !
 address-family ipv4 unicast
  network 10.2.0.0/16
  neighbor 10.0.4.1 activate
  neighbor 10.0.4.1 route-map PROVIDER-IN in
  neighbor 10.0.4.1 route-map PROVIDER-OUT out
  neighbor 10.0.5.1 activate
  neighbor 10.0.5.1 route-map PROVIDER-IN in
  neighbor 10.0.5.1 route-map PROVIDER-OUT out
 exit-address-family
!
line vty
!