frr version 10.7.1
frr defaults traditional
hostname b-edge
no ipv6 forwarding
!
interface eth1
 description L4 to wan-p1
 ip address 10.0.4.2/30
!
interface eth2
 description L5 to wan-p2
 ip address 10.0.5.2/30
!
interface eth3
 description L7 to b-core
 ip address 10.2.1.1/30
!
interface lo
 ip address 10.2.0.1/32
!
line vty
!