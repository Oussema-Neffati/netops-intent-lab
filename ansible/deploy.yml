- name: Deploy the network from the intent file
  hosts: routers
  connection: local
  gather_facts: false

  vars_files:
    - ../intent/network.yml

  vars:
    r: "{{ routers[inventory_hostname] }}"
    topology: "{{ playbook_dir }}/../topology/netops.clab.yml"
    backup_dir: "{{ playbook_dir }}/../backups"

  tasks:
    - name: Make sure the configs folder exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../configs"
        state: directory
        mode: "0755"
      run_once: true

    # 1. Intent -> topology and configs (same tasks as render.yml)
    - name: Render the Containerlab topology from the template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/topology.clab.yml.j2"
        dest: "{{ topology }}"
        mode: "0644"
      run_once: true
      notify: Redeploy the lab

    - name: Render the router config from the template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/frr.conf.j2"
        dest: "{{ playbook_dir }}/../configs/{{ inventory_hostname }}.conf"
        mode: "0644"
      notify: Redeploy the lab

    # 2. Is the lab running WITH its links? (after a restart, containers return without links)
    - name: Check whether the lab is running with its links
      ansible.builtin.command: docker exec clab-netops-a-edge1 ip link show eth1
      register: lab_check
      failed_when: false
      changed_when: false
      run_once: true

    # 3a. Missing or broken: remove any leftovers, then build it from scratch
    - name: Remove a broken lab (containers without links)
      ansible.builtin.command: containerlab destroy -t {{ topology }} --cleanup
      when: lab_check.rc != 0
      failed_when: false
      run_once: true

    - name: Deploy the lab
      ansible.builtin.command: containerlab deploy -t {{ topology }}
      when: lab_check.rc != 0
      run_once: true

    # 3b. Running and a config changed: the handler redeploys it now
    - name: Apply pending redeploy (only if a config changed)
      ansible.builtin.meta: flush_handlers

    # 4. Wait until the live network matches the intent (the validator passes)
    - name: Wait until the network matches the intent
      ansible.builtin.command: "{{ ansible_playbook_python }} {{ playbook_dir }}/../validator/validate.py --no-save"
      register: validation
      until: validation.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      run_once: true

    # 5. Backups: what each router is actually running
    - name: Make sure the backup folder exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0755"
      run_once: true

    - name: Read the running config from the router
      ansible.builtin.command: >
        docker exec clab-netops-{{ inventory_hostname }} vtysh -c "show running-config"
      register: running
      changed_when: false

    - name: Save the running config as a backup
      ansible.builtin.copy:
        content: "{{ running.stdout }}\n"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}.conf"
        mode: "0644"

  handlers:
    - name: Redeploy the lab
      ansible.builtin.command: containerlab deploy -t {{ topology }} --reconfigure
      when: lab_check.rc == 0
      run_once: true
