- name: Collect BGP status from all routers
  hosts: routers
  connection: local
  gather_facts: false

  tasks:
    - name: Run show bgp summary inside each router
      ansible.builtin.command: >
        docker exec clab-netops-{{ inventory_hostname }} vtysh -c "show bgp summary"
      register: bgp
      changed_when: false

    - name: Display the result
      ansible.builtin.debug:
        var: bgp.stdout_lines